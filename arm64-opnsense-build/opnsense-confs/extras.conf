check_xml()
{
	local XML=${1}
	local TAG=${2}

	if [ "$(grep -c '<'"${TAG}"' *.*>' ${XML})" != "0" ]; then
		echo "check_xml: <${TAG}/> already exists; stopping build" >&2
		exit 1
	fi
}

loader_conf_fixup()
{
	# XXX core package needs a little help here...
	if [ -f ${1}/usr/local/etc/rc.loader ]; then
		chroot ${1} /usr/local/etc/rc.loader
	fi

	if [ "${SELF}" != "vm" ]; then
		cat >> ${1}/boot/loader.conf << EOF
kern.cam.boot_delay="10000"
EOF
	fi

	if [ "${PRODUCT_SUFFIX}" = "-business" ]; then
		cat > ${1}/tmp/mirror.xml << EOF
    <firmware>
        <mirror>https://opnsense-update.deciso.com/FILL-IN-YOUR-LICENSE-HERE</mirror>
    </firmware>
EOF
		check_xml ${1}${CONFIG_XML} firmware
		sed -i '' -e "/<system>/r ${1}/tmp/mirror.xml" ${1}${CONFIG_XML}
		rm ${1}/tmp/mirror.xml
	elif [ -n "${ARM_REPOSITORY_URL:-}" ]; then
		# Official mirrors do not publish aarch64 packages.  Install the pinned
		# fingerprint and select the configured ARM mirror so the firmware GUI
		# can fetch compatible updates, packages, and plugins after first boot.
		case "${ARM_REPOSITORY_FINGERPRINT_NAME:-}" in
		*[!A-Za-z0-9._-]*|'')
			echo "Invalid ARM repository fingerprint filename" >&2
			exit 1
			;;
		esac
		case "${ARM_REPOSITORY_FINGERPRINT:-}" in
		*[!0-9a-f]*|'')
			echo "Invalid ARM repository SHA-256 fingerprint" >&2
			exit 1
			;;
		esac
		if [ "${#ARM_REPOSITORY_FINGERPRINT}" -ne 64 ]; then
			echo "ARM repository SHA-256 fingerprint must contain 64 hex characters" >&2
			exit 1
		fi

		FINGERPRINT_DIR=${1}/usr/local/etc/pkg/fingerprints/OPNsense/trusted
		mkdir -p "${FINGERPRINT_DIR}"
		cat > "${FINGERPRINT_DIR}/${ARM_REPOSITORY_FINGERPRINT_NAME}" << EOF
function: "sha256"
fingerprint: "${ARM_REPOSITORY_FINGERPRINT}"
EOF
		chmod 0444 "${FINGERPRINT_DIR}/${ARM_REPOSITORY_FINGERPRINT_NAME}"

		cat > ${1}/tmp/mirror.xml << EOF
    <firmware>
        <mirror>${ARM_REPOSITORY_URL}</mirror>
    </firmware>
EOF
		check_xml ${1}${CONFIG_XML} firmware
		sed -i '' -e "/<system>/r ${1}/tmp/mirror.xml" ${1}${CONFIG_XML}
		rm ${1}/tmp/mirror.xml

		# OPNsense uses -X for changelog and bogons downloads.  For ordinary
		# community mirrors, -X deliberately falls back to the official sample
		# repository; that path has no aarch64 tree.  -M returns the configured
		# release mirror instead.  Walker publishes and signs both auxiliary sets,
		# so keep normal signature verification and fetch them from that mirror.
		for ARM_FIRMWARE_SCRIPT in \
		    ${1}/usr/local/opnsense/scripts/firmware/changelog.sh \
		    ${1}/usr/local/opnsense/scripts/firmware/bogons.sh; do
			[ -f "${ARM_FIRMWARE_SCRIPT}" ] || {
				echo "Missing ARM firmware helper ${ARM_FIRMWARE_SCRIPT}" >&2
				exit 1
			}
			grep -q 'opnsense-update -X' "${ARM_FIRMWARE_SCRIPT}" || {
				echo "Unexpected ARM firmware helper format: ${ARM_FIRMWARE_SCRIPT}" >&2
				exit 1
			}
			sed -i '' -e 's/opnsense-update -X/opnsense-update -M/g' \
			    "${ARM_FIRMWARE_SCRIPT}"
		done
	fi
}

arm_hook()
{
	loader_conf_fixup ${1}

	cat > ${1}/tmp/arm.xml << EOF
    <use_mfs_tmp/>
    <use_mfs_var/>
    <serialspeed>${PRODUCT_COMSPEED}</serialspeed>
    <primaryconsole>video</primaryconsole>
    <secondaryconsole>serial</secondaryconsole>
EOF
	check_xml ${1}${CONFIG_XML} use_mfs_tmp
	check_xml ${1}${CONFIG_XML} use_mfs_var
	check_xml ${1}${CONFIG_XML} serialspeed
	check_xml ${1}${CONFIG_XML} primaryconsole
	check_xml ${1}${CONFIG_XML} secondaryconsole
	sed -i '' -e "/<system>/r ${1}/tmp/arm.xml" ${1}${CONFIG_XML}
	rm ${1}/tmp/arm.xml

	sed -i '' -e '/<rrd>/,/<\/rrd>/d' ${1}${CONFIG_XML}

	echo "-S${PRODUCT_COMSPEED} -D" > ${1}/boot.config

	cat >> ${1}/boot/loader.conf << EOF
beastie_disable="YES"
verbose_loading="YES"
comconsole_speed="${PRODUCT_COMSPEED}"
console="comconsole,vidconsole"
boot_multicons="YES"
boot_serial="YES"
usb_load="YES"
ugen_load="YES"
uhid_load="YES"
ukbd_load="YES"
umass_load="YES"
EOF

	# Preload the Realtek vendor driver selected by the device configuration for
	# the onboard RTL8125B 2.5GbE NICs.  Both R5C images use the physically
	# validated 1.98 package.  The newer 1102.01 package attaches after the PCIe
	# fixes, but its first board test blocked during OPNsense interface startup.
	case "${PRODUCT_DEVICE}" in
	R5C_UBOOT|R5C_DIAG|R5C_USB|R5S_EDK2|R5S_UBOOT|R5S_USB)
		cat >> ${1}/boot/loader.conf.local << EOF
if_re_load="YES"
if_re_name="/boot/modules/if_re.ko"
EOF
		case "${PRODUCT_DEVICE}" in
		R5C_UBOOT|R5C_DIAG|R5C_USB)
			# The two onboard RTL8125B EEPROMs report 00:00:00:00:00:00.
			# realtek-re-kmod198 consequently invents a new random address on
			# every attach.  Keep any genuine hardware address if a later board
			# revision provides one; otherwise derive two stable local-unicast
			# addresses from U-Boot's board-specific SMBIOS serial.  This runs
			# before rc.bootup, so normal OPNsense spoof-MAC configuration can
			# still replace either address afterward.
			cat > ${1}/usr/local/sbin/r5c-stable-mac << 'EOF'
#!/bin/sh

PATH=/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/sbin:/usr/local/bin
STATE=/var/run/r5c-stable-mac

IDENTITY=$(kenv -q smbios.system.serial 2>/dev/null || true)
IDENTITY=$(printf '%s' "${IDENTITY}" | tr -cd '0123456789abcdefABCDEF')
if [ "${#IDENTITY}" -lt 12 ]; then
	IDENTITY=$(kenv -q smbios.system.uuid 2>/dev/null || true)
	IDENTITY=$(printf '%s' "${IDENTITY}" | tr -cd '0123456789abcdefABCDEF')
fi

: > "${STATE}"
if [ "${#IDENTITY}" -lt 12 ]; then
	echo 'No stable R5C hardware identity was available; retaining driver addresses.' >> "${STATE}"
	logger -t r5c-stable-mac 'no stable SMBIOS identity; retaining driver addresses'
	exit 0
fi

for IFACE in re0 re1; do
	if ! ifconfig "${IFACE}" >/dev/null 2>&1; then
		continue
	fi

	# Do not replace a genuine EEPROM address.  The 1.98 driver explicitly
	# records this message only when it had to use its random fallback.
	if ! dmesg | grep -q "${IFACE}: Random ether addr:"; then
		CURRENT=$(ifconfig "${IFACE}" | awk '/ether / { print $2; exit }')
		echo "${IFACE}=${CURRENT} source=hardware" >> "${STATE}"
		continue
	fi

	DIGEST=$(printf 'nanopi-r5c:%s:%s\n' "${IDENTITY}" "${IFACE}" | sha256 -q)
	TAIL=$(printf '%s' "${DIGEST}" | cut -c1-10 | sed 's/../&:/g; s/:$//')
	MAC="02:${TAIL}"
	if ifconfig "${IFACE}" ether "${MAC}"; then
		echo "${IFACE}=${MAC} source=smbios-serial" >> "${STATE}"
		logger -t r5c-stable-mac "${IFACE} uses stable board-derived address ${MAC}"
	else
		echo "${IFACE}=unchanged source=assignment-failed" >> "${STATE}"
		logger -t r5c-stable-mac "could not assign stable address to ${IFACE}"
	fi
done

if mount | grep -q ' on /boot/msdos '; then
	{
		date -u
		echo "hardware_identity=${IDENTITY}"
		cat "${STATE}"
	} > /boot/msdos/R5CMAC.TXT 2>&1
	sync
fi
exit 0
EOF
			chmod 0555 ${1}/usr/local/sbin/r5c-stable-mac

			R5C_RC=${1}/usr/local/etc/rc
			R5C_RC_NEW=${R5C_RC}.stable-mac.$$
			awk '
				{ print }
				$0 == "export HOME PATH REQUESTS_CA_BUNDLE ZPOOL_IMPORT_PATH" {
					print "/usr/local/sbin/r5c-stable-mac"
					inserted++
				}
				END { if (inserted != 1) exit 2 }
			' "${R5C_RC}" > "${R5C_RC_NEW}" || {
				RESULT=$?
				rm -f "${R5C_RC_NEW}"
				echo "Could not install stable R5C MAC initialization in ${R5C_RC}" >&2
				exit "${RESULT}"
			}
			chmod 0555 "${R5C_RC_NEW}"
			mv "${R5C_RC_NEW}" "${R5C_RC}"

			# U-Boot's firmware DTB is suitable for firmware operation, but
			# FreeBSD needs the DTB compiled with its own RK3568 source tree.
			# EFI loader does not use the U-Boot-only fdt_file fallback when
			# firmware already supplied a tree.  Preloading a file with type
			# "dtb" gives it priority over the EFI configuration-table DTB in
			# fdt_setup_fdtp().  Without this, both PCIe root ports return
			# vendor 0x0000 phantom devices and neither RTL8125B NIC attaches.
			cat >> ${1}/boot/loader.conf.local << EOF
r5c_dtb_load="YES"
r5c_dtb_name="/boot/dtb/rockchip/rk3568-nanopi-r5c.dtb"
r5c_dtb_type="dtb"
EOF
			# The stock ARM config uses mismatch0/mismatch1 so a console user
			# can assign interfaces interactively.  R5C is normally deployed
			# headless, and its two onboard RTL8125B NICs attach as re0/re1.
			# Give the first NIC the stock LAN address and use the second as
			# DHCP WAN.  If the case labels are physically reversed, swap the
			# two cables; software assignment can be changed after login.
			sed -i '' \
			    -e 's|<if>mismatch0</if>|<if>re0</if>|' \
			    -e 's|<if>mismatch1</if>|<if>re1</if>|' \
			    ${1}${CONFIG_XML}
			;;
		esac
		if [ "${PRODUCT_DEVICE}" = "R5C_UBOOT" ] || \
		    [ "${PRODUCT_DEVICE}" = "R5C_DIAG" ]; then
			# This is a kernel mount-from variable, not loader.efi's rootdev.
			# loader.efi still discovers the disk containing /boot/kernel.
			cat >> ${1}/boot/loader.conf.local << EOF
vfs.root.mountfrom="ufs:/dev/ufs/OPNsense_ARM"
EOF
		fi
		;;
	OP5P|OP5P_EDK2|OP5P_MBR)
		cat >> ${1}/boot/loader.conf.local << EOF
if_re_load="YES"
if_re_name="/boot/modules/if_re.ko"

# This makes FreeBSD show the Realtek NIC's
kern.cfg.order="acpi"

console="efi"
EOF
		;;
	esac

	# The diagnostic image records five OS-side checkpoints and useful boot
	# evidence on the EFI/FAT partition.  Together with the U-Boot markers,
	# this distinguishes a firmware/EFI failure from root-mount, rc, PCI, or
	# network initialization failures without requiring a UART adapter.
	if [ "${PRODUCT_DEVICE}" = "R5C_DIAG" ]; then
		# Include DesignWare iATU mode/window detection and PCI resource
		# allocation details in dmesg for no-UART PCIe diagnosis.
		cat >> ${1}/boot/loader.conf.local << EOF
boot_verbose="YES"
EOF
		cat > ${1}/usr/local/sbin/r5c-diag-performance << 'EOF'
#!/bin/sh

# The first routed test remained fixed at 816 MHz under load even though the
# RK3568 exposes a 1992 MHz operating point.  Use the maximum available level
# for this diagnostic boot so CPU scaling cannot hide NIC/driver throughput.
# This is intentionally limited to R5C_DIAG until power and thermal behavior
# have been physically validated.
PATH=/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/sbin:/usr/local/bin
LOGFILE=/boot/msdos/R5CPERF.TXT

mkdir -p /boot/msdos >/dev/null 2>&1 || exit 0
mount | grep -q ' on /boot/msdos ' || \
	mount -t msdosfs /dev/msdosfs/MSDOSBOOT /boot/msdos >/dev/null 2>&1 || exit 0

{
	echo 'NanoPi R5C diagnostic performance initialization'
	date -u
	echo '--- selected Realtek package ---'
	pkg info realtek-re-kmod realtek-re-kmod198 2>&1 || true
	echo '--- loaded Realtek module ---'
	kldstat -v | grep -A4 -B2 if_re 2>&1 || true
	echo '--- CPU before maximum-frequency request ---'
	sysctl dev.cpu.0.freq dev.cpu.0.freq_levels 2>&1 || true
	MAX_FREQ=$(sysctl -n dev.cpu.0.freq_levels 2>/dev/null | awk '{ split($1, value, "/"); print value[1] }')
	case "${MAX_FREQ}" in
	''|*[!0-9]*) echo 'Unable to determine maximum CPU frequency' ;;
	*) sysctl "dev.cpu.0.freq=${MAX_FREQ}" 2>&1 || true ;;
	esac
	echo '--- CPU after maximum-frequency request ---'
	sysctl dev.cpu.0.freq dev.cpu.0.freq_levels 2>&1 || true
	echo '--- supported and negotiated Ethernet media ---'
	ifconfig -m re0 2>&1 || true
	ifconfig -m re1 2>&1 || true
	echo '--- relevant driver attach messages ---'
	dmesg | grep -Ei 're[01]:|Realtek|TXCFG|ether addr|MSI-X' || true
} > "${LOGFILE}" 2>&1
sync
exit 0
EOF
		chmod 0555 ${1}/usr/local/sbin/r5c-diag-performance

		cat > ${1}/usr/local/sbin/r5c-diag-marker << 'EOF'
#!/bin/sh

# Record OPNsense startup progress on the removable FAT partition.  Always
# return success so diagnostics cannot change the outcome of the real boot.
PATH=/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/sbin:/usr/local/bin
MARKER=${1:-}
LOGFILE=${2:-}
case "${MARKER}:${LOGFILE}" in
R5C*.OK:R5C*.TXT) ;;
*) exit 0 ;;
esac

mkdir -p /boot/msdos >/dev/null 2>&1 || exit 0
NEW_MOUNT=no
if ! mount | grep -q ' on /boot/msdos '; then
	mount -t msdosfs /dev/msdosfs/MSDOSBOOT /boot/msdos >/dev/null 2>&1 || exit 0
	NEW_MOUNT=yes
fi

printf '%s\n' "${MARKER}" > "/boot/msdos/${MARKER}" 2>/dev/null || true
{
	date -u
	uname -a
	echo '--- mount ---'
	mount
	echo '--- glabel ---'
	glabel status -as
	echo '--- kenv ---'
	kenv
	echo '--- ifconfig ---'
	ifconfig -a
	echo '--- pciconf ---'
	pciconf -lv
	echo '--- live PCIe device-tree ranges ---'
	if command -v ofwdump >/dev/null 2>&1; then
		ofwdump -P ranges /pcie@fe270000 2>&1 || true
		ofwdump -P ranges /pcie@fe280000 2>&1 || true
	else
		echo 'ofwdump is unavailable'
	fi
	echo '--- RTL8125 PCI configuration registers 0x00-0x3f ---'
	pciconf -lv | awk '
		/^[^[:space:]]+@pci[0-9]+:/ {
			device = $1
			sub(/^[^@]*@/, "", device)
			sub(/:$/, "", device)
		}
		/vendor=0x10ec device=0x8125/ { print device }
	' | while read -r device; do
		echo "[${device}]"
		pciconf -r "${device}" 0:64 || true
	done
	echo '--- kernel modules ---'
	kldstat -v
	echo '--- Realtek packages ---'
	pkg info realtek-re-kmod realtek-re-kmod198 2>&1 || true
	echo '--- dmesg ---'
	dmesg
} > "/boot/msdos/${LOGFILE}" 2>&1 || true
sync
[ "${NEW_MOUNT}" = no ] || umount /boot/msdos >/dev/null 2>&1 || true
exit 0
EOF
		chmod 0555 ${1}/usr/local/sbin/r5c-diag-marker

		cat > ${1}/usr/local/sbin/r5c-diag-bootwatch << 'EOF'
#!/bin/sh

# rc.bootup configures the assigned LAN/WAN interfaces and starts the OPNsense
# services.  If that process exits or blocks before the normal checkpoint, a
# headless R5C otherwise leaves no evidence beyond an unconfigured NIC.  Take
# several bounded snapshots around that stage without changing interface state.
PATH=/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/sbin:/usr/local/bin
LOGDIR=/boot/msdos
LOGFILE=${LOGDIR}/R5CWATCH.TXT
RUNFILE=${LOGDIR}/R5CWATCH.RUN
OKFILE=${LOGDIR}/R5CWATCH.OK
LOCKDIR=/var/run/r5c-diag-bootwatch.lock

mkdir "${LOCKDIR}" >/dev/null 2>&1 || exit 0
cleanup()
{
	rmdir "${LOCKDIR}" >/dev/null 2>&1 || true
}
trap cleanup 0 1 2 15

mkdir -p "${LOGDIR}" >/dev/null 2>&1 || exit 0
if ! mount | grep -q " on ${LOGDIR} "; then
	mount -t msdosfs /dev/msdosfs/MSDOSBOOT "${LOGDIR}" >/dev/null 2>&1 || exit 0
fi

rm -f "${OKFILE}"
printf 'Watching OPNsense rc.bootup for up to four minutes.\n' > "${RUNFILE}" 2>/dev/null || exit 0
{
	echo 'NanoPi R5C OPNsense boot watchdog'
	date -u
	uname -a
} > "${LOGFILE}" 2>&1 || true

sample=1
for delay in 1 4 10 15 30 60 120; do
	sleep "${delay}"
	{
		echo
		echo "===== rc.bootup snapshot ${sample}; slept ${delay} seconds ====="
		date -u
		uptime
		echo '--- boot checkpoint files ---'
		ls -la "${LOGDIR}"/R5C* 2>&1 || true
		echo '--- relevant processes ---'
		pgrep -alf 'rc.bootup|configd|dhclient|dhcp6c|filter_configure|ifconfig' 2>&1 || true
		ps auxww 2>&1 || true
		ps axlww 2>&1 || true
		echo '--- relevant process wait states and open files ---'
		for pid in $(pgrep -f 'rc.bootup|configd.py|dhclient|dhcp6c' 2>/dev/null); do
			echo "[pid ${pid}]"
			procstat -kk "${pid}" 2>&1 || true
			procstat -f "${pid}" 2>&1 || true
			procstat -r "${pid}" 2>&1 || true
			procstat -t "${pid}" 2>&1 || true
		done
		echo '--- exact OPNsense boot phase ---'
		cat "${LOGDIR}/R5CPHASE.TXT" 2>&1 || true
		echo '--- configured LAN and WAN ---'
		sed -n '/<interfaces>/,/<\/interfaces>/p' /usr/local/etc/config.xml 2>&1 || true
		echo '--- interfaces and supported media ---'
		ifconfig -m re0 2>&1 || true
		ifconfig -m re1 2>&1 || true
		echo '--- routing table ---'
		netstat -rn 2>&1 || true
		echo '--- sockets ---'
		sockstat -46 2>&1 || true
		echo '--- Realtek driver state ---'
		sysctl dev.re.0 dev.re.1 2>&1 || true
		echo '--- recent kernel messages ---'
		dmesg | tail -160
		echo '--- recent OPNsense and configd logs ---'
		tail -120 /var/log/system/latest.log 2>&1 || true
		tail -120 /var/log/configd/latest.log 2>&1 || true
	} >> "${LOGFILE}" 2>&1 || true
	sync

	if [ -f "${LOGDIR}/R5CBTOK.OK" ] || [ -f "${LOGDIR}/R5CBTFL.OK" ]; then
		printf 'OPNsense rc.bootup returned; see R5CBTUP.TXT and R5CWATCH.TXT.\n' > "${OKFILE}" 2>/dev/null || true
		rm -f "${RUNFILE}"
		sync
		exit 0
	fi
	sample=$((sample + 1))
done

printf 'OPNsense rc.bootup was still running after the final snapshot.\n' > "${OKFILE}" 2>/dev/null || true
rm -f "${RUNFILE}"
sync
exit 0
EOF
		chmod 0555 ${1}/usr/local/sbin/r5c-diag-bootwatch

		cat > ${1}/usr/local/sbin/r5c-diag-netlog << 'EOF'
#!/bin/sh

# Capture the live state that the boot checkpoints cannot see: negotiated
# Ethernet media, traffic/error counters, CPU load/frequency/temperature, and
# interrupt activity while a throughput test runs.  Keep the logger bounded so
# a diagnostic image left in service cannot fill its small EFI/FAT partition.
PATH=/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/sbin:/usr/local/bin
LOGDIR=/boot/msdos
LOGFILE=${LOGDIR}/R5CNET.TXT
RUNFILE=${LOGDIR}/R5CNET.RUN
OKFILE=${LOGDIR}/R5CNET.OK
LOCKDIR=/var/run/r5c-diag-netlog.lock
SAMPLES=180
INTERVAL=9

mkdir "${LOCKDIR}" >/dev/null 2>&1 || exit 0
cleanup()
{
	rmdir "${LOCKDIR}" >/dev/null 2>&1 || true
}
trap cleanup 0 1 2 15

mkdir -p "${LOGDIR}" >/dev/null 2>&1 || exit 0
if ! mount | grep -q " on ${LOGDIR} "; then
	mount -t msdosfs /dev/msdosfs/MSDOSBOOT "${LOGDIR}" >/dev/null 2>&1 || exit 0
fi

rm -f "${OKFILE}"
printf 'R5C network logger is running for approximately 30 minutes.\n' > "${RUNFILE}" 2>/dev/null || exit 0
{
	echo 'NanoPi R5C live network diagnostic log'
	echo '180 samples at approximately 10-second intervals'
	date -u
	uname -a
	echo '--- driver and interface sysctls at start ---'
	sysctl dev.re.0 dev.re.1 2>&1 || true
	echo '--- network dispatch sysctls ---'
	sysctl net.isr 2>&1 || true
	echo '--- PCIe capabilities ---'
	pciconf -l | awk '/^re[01]@/ { device = $1; sub(/^[^@]*@/, "", device); sub(/:$/, "", device); print device }' |
	while read -r device; do
		echo "[${device}]"
		pciconf -lc "${device}" 2>&1 || true
	done
} > "${LOGFILE}" 2>&1 || true

sample=1
while [ "${sample}" -le "${SAMPLES}" ]; do
	{
		echo
		echo "===== sample ${sample}/${SAMPLES} ====="
		date -u
		uptime
		echo '--- negotiated media ---'
		ifconfig -m re0 2>&1 || true
		ifconfig -m re1 2>&1 || true
		echo '--- interface byte/error/drop counters ---'
		netstat -I re0 -bdn 2>&1 || true
		netstat -I re1 -bdn 2>&1 || true
		echo '--- CPU frequency and temperature ---'
		sysctl dev.cpu.0.freq dev.cpu.0.freq_levels 2>&1 || true
		sysctl -a 2>/dev/null | grep -Ei 'temperature|thermal|throttl' || true
		echo '--- one-second CPU sample ---'
		vmstat -P -c 2 -w 1 2>&1 || true
	} >> "${LOGFILE}" 2>&1 || true

	# Flush once a minute.  More frequent syncs add unnecessary SD-card writes;
	# the RUN marker still identifies an interrupted logging session.
	if [ $((sample % 6)) -eq 0 ]; then
		sync
	fi
	sample=$((sample + 1))
	[ "${sample}" -gt "${SAMPLES}" ] || sleep "${INTERVAL}"
done

{
	echo
	echo '===== final state ====='
	date -u
	echo '--- interrupts ---'
	vmstat -i 2>&1 || true
	echo '--- mbufs ---'
	netstat -m 2>&1 || true
	echo '--- driver and interface sysctls at end ---'
	sysctl dev.re.0 dev.re.1 2>&1 || true
} >> "${LOGFILE}" 2>&1 || true
printf 'R5C network logger completed.\n' > "${OKFILE}" 2>/dev/null || true
rm -f "${RUNFILE}"
sync
exit 0
EOF
		chmod 0555 ${1}/usr/local/sbin/r5c-diag-netlog

		# Add diagnostic-only phase boundaries around every top-level rc.bootup
		# operation.  R5CBTUP.TXT shows normal console output, while this compact
		# append-only file identifies the exact function that did not return.
		R5C_BOOTUP=${1}/usr/local/etc/rc.bootup
		R5C_BOOTUP_NEW=${R5C_BOOTUP}.r5c.$$
		awk '
			function phase_begin(name) {
				print "r5c_diag_phase(\"BEGIN " name "\");"
			}
			function phase_end(name) {
				print "r5c_diag_phase(\"END " name "\");"
			}
			function wrap(name, line) {
				phase_begin(name)
				print line
				phase_end(name)
			}
			$0 == "convert_config();" {
				print "function r5c_diag_phase($phase)"
				print "{"
				print "    $line = gmdate(\"c\") . \" pid=\" . getmypid() . \" \" . $phase . \"\\n\";"
				print "    @file_put_contents(\"/boot/msdos/R5CPHASE.TXT\", $line, FILE_APPEND | LOCK_EX);"
				print "    echo \"[R5C] {$phase}\\n\";"
				print "    flush();"
				print "}"
				wrap("convert_config", $0)
				convert = 1
				next
			}
			$0 == "system_devd_configure(true);" { wrap("system_devd_configure", $0); devd = 1; next }
			$0 == "system_login_configure(true);" { wrap("system_login_configure", $0); login = 1; next }
			$0 == "if (is_interface_mismatch()) {" {
				phase_begin("interface_mismatch_check")
				print
				mismatch = 1
				next
			}
			$0 == "interfaces_loopback_configure(true); /* loopback device is required early for syslog */" {
				if (mismatch) phase_end("interface_mismatch_check")
				wrap("interfaces_loopback_configure", $0)
				loopback = 1
				next
			}
			$0 == "system_kernel_configure(true);" { wrap("system_kernel_configure", $0); kernel = 1; next }
			$0 == "system_sysctl_configure(true);" { wrap("system_sysctl_configure", $0); sysctl = 1; next }
			$0 == "system_timezone_configure(true);" { wrap("system_timezone_configure", $0); timezone = 1; next }
			$0 == "system_firmware_configure(true);" { wrap("system_firmware_configure", $0); firmware = 1; next }
			$0 == "system_trust_configure(true);" { wrap("system_trust_configure", $0); trust = 1; next }
			$0 == "system_hostname_configure(true);" { wrap("system_hostname_configure", $0); hostname = 1; next }
			$0 ~ /^system_resolver_configure\(true\);/ {
				resolver++
				wrap("system_resolver_configure_" resolver, $0)
				next
			}
			$0 == "system_syslog_start(true);" { wrap("system_syslog_start", $0); syslog = 1; next }
			$0 == "filter_configure_sync(true, false); /* apply default policy before interface setup */" { wrap("filter_configure_initial", $0); filter_initial = 1; next }
			$0 == "interfaces_hardware(true);" { wrap("interfaces_hardware", $0); hardware = 1; next }
			$0 == "interfaces_configure(true);" { wrap("interfaces_configure", $0); interfaces = 1; next }
			$0 == "filter_configure_sync(true);" {
				filter++
				wrap("filter_configure_sync_" filter, $0)
				next
			}
			$0 == "plugins_configure(\047early\047, true);" { wrap("plugins_early", $0); early = 1; next }
			$0 == "system_routing_configure(true, null, \047ignore\047);" { wrap("system_routing_configure", $0); routing = 1; next }
			$0 == "plugins_configure(\047dhcp\047, true);" { wrap("plugins_dhcp", $0); dhcp = 1; next }
			$0 == "plugins_configure(\047dns\047, true);" { wrap("plugins_dns", $0); dns = 1; next }
			$0 == "plugins_configure(\047monitor\047, true);" { wrap("plugins_monitor", $0); monitor = 1; next }
			$0 == "plugins_configure(\047vpn\047, true);" { wrap("plugins_vpn", $0); vpn = 1; next }
			$0 == "plugins_configure(\047bootup\047, true);" { wrap("plugins_bootup", $0); bootup = 1; next }
			{ print }
			END {
				if (!(convert && devd && login && mismatch && loopback && kernel && sysctl && timezone && firmware && trust && hostname && resolver == 2 && syslog && filter_initial && hardware && interfaces && filter == 2 && early && routing && dhcp && dns && monitor && vpn && bootup)) exit 2
			}
		' "${R5C_BOOTUP}" > "${R5C_BOOTUP_NEW}" || {
			RESULT=$?
			rm -f "${R5C_BOOTUP_NEW}"
			echo "Could not install R5C phase markers in ${R5C_BOOTUP}" >&2
			exit "${RESULT}"
		}
		chmod 0555 "${R5C_BOOTUP_NEW}"
		mv "${R5C_BOOTUP_NEW}" "${R5C_BOOTUP}"

		# OPNsense replaces the normal FreeBSD rc path with /usr/local/etc/rc,
		# so checkpoints must be inserted into that script rather than relying
		# only on /etc/rc.d ordering.
		R5C_RC=${1}/usr/local/etc/rc
		R5C_RC_NEW=${R5C_RC}.r5c.$$
		awk '
			$0 ~ /^\/usr\/local\/bin\/flock .*\/usr\/local\/etc\/rc\.bootup/ {
				print "rm -f /boot/msdos/R5CBTOK.OK /boot/msdos/R5CBTFL.OK /boot/msdos/R5CWATCH.OK /boot/msdos/R5CWATCH.RUN /boot/msdos/R5CWATCH.TXT /boot/msdos/R5CPHASE.TXT"
				print ": > /boot/msdos/R5CBTUP.TXT"
				print "/usr/local/sbin/r5c-diag-marker R5CBTBG.OK R5CBTBG.TXT"
				print "/usr/sbin/daemon -f /usr/local/sbin/r5c-diag-bootwatch >/dev/null 2>&1 || true"
				print "/usr/local/bin/flock -n -o ${BOOTLOCK} /usr/local/etc/rc.bootup >> /boot/msdos/R5CBTUP.TXT 2>&1"
				print "R5C_BOOTUP_STATUS=$?"
				print "if [ \"${R5C_BOOTUP_STATUS}\" -ne 0 ]; then"
				print "\t/usr/local/sbin/r5c-diag-marker R5CBTFL.OK R5CBTFL.TXT"
				print "\texit \"${R5C_BOOTUP_STATUS}\""
				print "fi"
				print "/usr/local/sbin/r5c-diag-marker R5CBTOK.OK R5CBTOK.TXT"
				bootup = 1
				next
			}
			{ print }
			$0 == "export HOME PATH REQUESTS_CA_BUNDLE ZPOOL_IMPORT_PATH" {
				print "/usr/local/sbin/r5c-diag-marker R5CINIT.OK R5CINIT.TXT"
				init = 1
			}
			$0 == "done < /etc/fstab" {
				print "/usr/local/sbin/r5c-diag-marker R5CFSTB.OK R5CFSTB.TXT"
				fstab = 1
			}
			$0 == "/usr/local/etc/rc.subr.d/php" {
				print "/usr/local/sbin/r5c-diag-marker R5CPHP.OK R5CPHP.TXT"
				php = 1
			}
			$0 == "/usr/local/etc/rc.syshook start" {
				print "/usr/local/sbin/r5c-diag-marker R5CRC.OK R5CRC.TXT"
				print "/usr/local/sbin/r5c-diag-performance >/dev/null 2>&1 || true"
				print "/usr/sbin/daemon -f /usr/local/sbin/r5c-diag-netlog >/dev/null 2>&1 || true"
				finish = 1
			}
			END {
				if (!(init && fstab && php && bootup && finish)) exit 2
			}
		' "${R5C_RC}" > "${R5C_RC_NEW}" || {
			RESULT=$?
			rm -f "${R5C_RC_NEW}"
			echo "Could not install R5C checkpoints in ${R5C_RC}" >&2
			exit "${RESULT}"
		}
		chmod 0555 "${R5C_RC_NEW}"
		mv "${R5C_RC_NEW}" "${R5C_RC}"

		cat > ${1}/etc/rc.d/r5c_diag_early << 'EOF'
#!/bin/sh
# PROVIDE: r5c_diag_early
# REQUIRE: FILESYSTEMS
# BEFORE: netif

. /etc/rc.subr

name="r5c_diag_early"
start_cmd="r5c_diag_early_start"
stop_cmd=":"

r5c_diag_early_start()
{
	mount | grep -q ' on /boot/msdos ' || mount /boot/msdos >/dev/null 2>&1 || return 0
	printf 'FreeBSD mounted root and entered rc.\n' > /boot/msdos/R5CROOT.OK
	dmesg > /boot/msdos/R5CEARL.TXT 2>&1
	sync
}

load_rc_config "${name}"
run_rc_command "$1"
EOF
		chmod 0555 ${1}/etc/rc.d/r5c_diag_early

		cat > ${1}/etc/rc.d/r5c_diag_late << 'EOF'
#!/bin/sh
# PROVIDE: r5c_diag_late
# REQUIRE: LOGIN

. /etc/rc.subr

name="r5c_diag_late"
start_cmd="r5c_diag_late_start"
stop_cmd=":"

r5c_diag_late_start()
{
	mount | grep -q ' on /boot/msdos ' || mount /boot/msdos >/dev/null 2>&1 || return 0
	printf 'FreeBSD reached the late rc stage.\n' > /boot/msdos/R5CRC.OK
	dmesg > /boot/msdos/R5CDMESG.TXT 2>&1
	ifconfig -a > /boot/msdos/R5CIFCFG.TXT 2>&1
	pciconf -lv > /boot/msdos/R5CPCI.TXT 2>&1
	mount > /boot/msdos/R5CMOUNT.TXT 2>&1
	kenv > /boot/msdos/R5CKENV.TXT 2>&1
	{
		date -u
		uname -a
		sysctl kern.boottime kern.bootfile kern.conftxt 2>&1
	} > /boot/msdos/R5CSYS.TXT
	sync
}

load_rc_config "${name}"
run_rc_command "$1"
EOF
		chmod 0555 ${1}/etc/rc.d/r5c_diag_late
	fi

	touch ${1}/.probe.for.growfs
}

dvd_hook()
{
	loader_conf_fixup ${1}
}

nano_hook()
{
	loader_conf_fixup ${1}

	cat > ${1}/tmp/nano.xml << EOF
    <use_mfs_tmp/>
    <use_mfs_var/>
    <serialspeed>${PRODUCT_COMSPEED}</serialspeed>
    <primaryconsole>serial</primaryconsole>
    <secondaryconsole>video</secondaryconsole>
EOF
	check_xml ${1}${CONFIG_XML} use_mfs_tmp
	check_xml ${1}${CONFIG_XML} use_mfs_var
	check_xml ${1}${CONFIG_XML} serialspeed
	check_xml ${1}${CONFIG_XML} primaryconsole
	check_xml ${1}${CONFIG_XML} secondaryconsole
	sed -i '' -e "/<system>/r ${1}/tmp/nano.xml" ${1}${CONFIG_XML}
	cat > ${1}/tmp/nano.xml << EOF
    <Hostwatch>
      <general>
        <enabled>0</enabled>
      </general>
    </Hostwatch>
EOF
	check_xml ${1}${CONFIG_XML} Hostwatch
	sed -i '' -e "/<OPNsense>/r ${1}/tmp/nano.xml" ${1}${CONFIG_XML}
	rm ${1}/tmp/nano.xml

	sed -i '' -e "/<rrd>/,/<\/rrd>/d" ${1}${CONFIG_XML}

	echo "-S${PRODUCT_COMSPEED} -h -D" > ${1}/boot.config

	cat >> ${1}/boot/loader.conf << EOF
comconsole_speed="${PRODUCT_COMSPEED}"
console="comconsole,vidconsole"
boot_multicons="YES"
boot_serial="YES"
EOF

	touch ${1}/.probe.for.growfs
}

serial_hook()
{
	loader_conf_fixup ${1}

	echo "-S${PRODUCT_COMSPEED} -h" > ${1}/boot.config

	cat >> ${1}/boot/loader.conf << EOF
comconsole_speed="${PRODUCT_COMSPEED}"
console="comconsole"
boot_serial="YES"
EOF

	if  [ ! -f ${1}${CONFIG_XML} ]; then
		return
	fi

	cat > ${1}/tmp/serial.xml << EOF
    <serialspeed>${PRODUCT_COMSPEED}</serialspeed>
    <primaryconsole>serial</primaryconsole>
EOF
	check_xml ${1}${CONFIG_XML} serialspeed
	check_xml ${1}${CONFIG_XML} primaryconsole
	sed -i '' -e "/<system>/r ${1}/tmp/serial.xml" ${1}${CONFIG_XML}
	rm ${1}/tmp/serial.xml
}

vga_hook()
{
	loader_conf_fixup ${1}
}

vm_hook()
{
	loader_conf_fixup ${1}

	touch ${1}/.probe.for.growfs
}
