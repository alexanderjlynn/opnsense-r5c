# FriendlyELEC NanoPi R5C diagnostic image.  The disk layout is identical to
# R5C_UBOOT; only the U-Boot fragment selected during the port build differs.

export PRODUCT_KERNEL=SMP-ARM
export PRODUCT_TARGET=arm64
export PRODUCT_ARCH=aarch64
export PRODUCT_WANTS="u-boot-nanopi-r5c"
export PRODUCT_WANTS_CROSS="aarch64-binutils qemu-user-static"
# The current 1102.01 driver attached both RTL8125B controllers after the PCIe
# MMIO/iATU fixes, but the first hardware test stopped during OPNsense interface
# initialization before LAN addressing, DHCP, or the Web UI.  Use the 1.98
# driver that already completed a routed boot while retaining the additional
# 2.5GbE, CPU-frequency, and startup diagnostics in this image.
# iperf3 is included so routed testing does not depend on a runtime repository.
export PRODUCT_ADDITIONS="realtek-re-kmod198 iperf3"
export PRODUCT_COMSPEED=1500000

export ARM_FAT_SIZE="32m -b 64m"
export ARM_UBOOT_DIR="/usr/local/share/u-boot/u-boot-nanopi-r5c"

arm_install_uboot()
{
	sysctl kern.geom.debugflags=0x10
	dd if=${ARM_UBOOT_DIR}/idbloader.img of=/dev/${DEV} seek=64 bs=512 conv=sync
	dd if=${ARM_UBOOT_DIR}/u-boot.itb of=/dev/${DEV} seek=16384 bs=512 conv=sync
	sysctl kern.geom.debugflags=0x0
}
